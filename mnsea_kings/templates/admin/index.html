{% extends "admin/index.html" %}
{% load i18n %}
{% block content %}
<section class="mk-admin-command">
  <div>
    <span class="mk-admin-kicker">Operations intelligence</span>
    <h1>Stock control centre</h1>
    <p>Daily movement, inventory health, and month-end controls in one place.</p>
  </div>
  <a class="mk-admin-launch" href="{% url 'admin:inventory_stock_dashboard' %}">Open analytics dashboard <span>-></span></a>
</section>
{{ block.super }}
<style>
  .mk-admin-command { display:flex; align-items:center; justify-content:space-between; gap:20px; margin:0 0 24px; padding:22px 26px; border:1px solid #dfe6eb; border-left:5px solid #1769aa; border-radius:8px; background:linear-gradient(105deg,#f8fbfd,#fff); }
  .mk-admin-kicker { color:#1769aa; font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; }
  .mk-admin-command h1 { margin:4px 0; color:#17212b; font-size:26px; }
  .mk-admin-command p { margin:0; color:#687582; font-size:13px; }
  .mk-admin-launch { padding:10px 14px; border-radius:6px; color:#fff !important; background:#1769aa; font-size:13px; font-weight:600; white-space:nowrap; }
  .mk-admin-launch span { margin-left:8px; font-size:16px; }
  @media (max-width:650px) { .mk-admin-command { align-items:flex-start; flex-direction:column; } }
</style>
{% endblock %}
